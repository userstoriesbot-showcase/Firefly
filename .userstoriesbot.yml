# Showcase fork only (never part of an upstream pull request).
# pnpm 11.22 comes from package.json "packageManager" through corepack; engines need Node >= 22.23.
# `pnpm dev` runs `astro dev`; pnpm passes the flags through (checked locally on another port).
version: 1
app:
  install: "corepack enable && pnpm install --frozen-lockfile"
  start: pnpm dev --port {port} --host 0.0.0.0
  url: http://localhost:{port}
  readyPath: /
  runtime: node24
demo:
  maxVideos: 1
  beforePass: true
